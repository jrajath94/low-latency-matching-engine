[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "low-latency-matching-engine"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24.0", "pandas>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.4.0", "mypy>=1.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/low_latency_matching_engine --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = false
no_strict_optional = true
